# pycodestyle configuration for the suites job's pycodestyle gate. The
# ceiling is the tree's measured convention: the longest line is a 561-column
# fixture line in the ported screen's own suite, whose reformat is a separate
# change from adopting this gate, and the runner-up lines sit far below it.
# An `ignore =` line REPLACES pycodestyle's default ignore list rather than
# extending it, so the line below is that default list (E121, E123, E126,
# E226, E24, E704, W503, W504) spelled out beside the two codes this tree
# adds, each a shape the checker cannot see the reason for:
#   E402 — run.py and the ported suite's loader insert the module's path on
#     sys.path before importing it, which is the pattern the import order
#     rule exists to refuse;
#   W293 — whitespace-only lines inside the suite's embedded fixtures are
#     fixture bytes the screen reads, not stray blanks.
[pycodestyle]
max-line-length = 561
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E402,W293
