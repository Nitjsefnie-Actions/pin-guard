name: Pin test screen
description: >-
  No test asserts on a pinned version, tag, SHA or digest of any dependency;
  the screened head's candidates are reported as review line comments.
inputs:
  fail-on-candidates:
    description: Fail the job when the screened head has candidates.
    required: false
    default: 'false'
  github-token:
    description: Token for the GitHub API reads and the comment writes.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - name: Screen the pull request's head
      shell: bash
      # Inputs are data: none becomes shell program text. The action reads
      # the PR only through the API at the head; it never checks out or
      # executes pull-request code, so a fork's pull request screens too.
      env:
        PIN_GUARD_FAIL_ON_CANDIDATES: ${{ inputs.fail-on-candidates }}
        PIN_GUARD_GITHUB_TOKEN: ${{ inputs.github-token }}
        PIN_GUARD_REPO: ${{ github.repository }}
        PIN_GUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
        PIN_GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python3 -I "$GITHUB_ACTION_PATH/run.py"
