name: secrets

# The daily full-history re-answer. The shellcheck job in tests.yml already
# scans the tree and the full git history on every pull request and every push
# to main, so a secret reaching a pull request or main is caught there; the
# schedule exists for the commits that run can never see: ones that landed
# before those workflows did, ones pushed with [skip ci], and any whose secret
# only becomes detectable when the frozen scanner's rules improve with a
# version bump. The cron re-answers for the whole history each morning, so
# such a commit is caught the next day rather than never.
#
# CRON TRIGGER ONLY, on purpose. Gating belongs to the shellcheck job in
# tests.yml, which already runs on every pull request and every push to main;
# a push or pull_request trigger here would schedule the same commit a second
# time under a different ref, which the concurrency group cannot collapse (the
# same trap tests.yml and actionlint.yml document on their push triggers). No
# workflow_dispatch either: a scan wanted early is available the next morning
# regardless, and a second way to start the run is a second way for a manual
# run to be mistaken for the scheduled record.
#
# THE SCAN IS Nitjsefnie-Actions/secret-scan, pinned by commit SHA. It runs
# gitleaks 8.30.1 over the whole tree and history, downloads the binary and
# that release's default rules, each checked against its digest, and reads
# .gitleaks.toml and .gitleaksignore from the commit the change is judged
# against: on this schedule, the default branch's tip.

on:
  schedule:
    # Off the hour, split from this repository's other crons: codeql runs
    # Wednesdays 03:47, scorecard Saturdays 02:23.
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: secret-scan scans the whole history, so it needs
          # a full-history checkout.
          fetch-depth: 0
          # Nothing pushes; the job token must not survive the checkout.
          persist-credentials: false

      - name: Scan the tree and the history
        # No condition or continue-on-error: this step's outcome IS the gate.
        uses: Nitjsefnie-Actions/secret-scan@74f89d79a41106c9a65c23f20895b23240665f26 # v1.0.0
