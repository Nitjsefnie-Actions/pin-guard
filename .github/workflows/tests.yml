name: tests

# Both POSIX legs run the same pytest suite, and coverage is measured on the
# ubuntu cell only; the legs are the repository's matrix, so the required
# check names are `suites (ubuntu-latest)` and `suites (macos-latest)`.
#
# The suite's toolchain is installed from the hash-pinned manifests: pytest
# from the root requirements-test.txt, and the workflow's own installs from
# .github/workflows/requirements.txt -- the lint step's hash-pinned ruff,
# the type/lint steps' hash-pinned pylint, pycodestyle and pyright, and the
# hash-pinned coverage installed twice -- in the coverage cell and again in
# the diff-coverage job, which never runs a suite and needs only the
# statement analyzer -- each lifted out of the manifest with awk, the way
# the workflow reads it. Every install pins artifacts with --require-hashes;
# a version pin alone still installs whatever bytes the index serves.
#
# Coverage is measured on exactly one cell so the reported number names a
# single reproducible environment. The suite runs on CPython 3.15 (the
# interpreter actions/setup-python provides, the version the action and CI
# target); its own processes and any subprocess the suite starts are
# measured by coverage's startup hook, which the Install coverage tooling
# step writes into that interpreter's site-packages and arms through
# COVERAGE_PROCESS_START. On the other cell the step is skipped and the
# suite runs unmeasured. The floor lives in .github/ci-thresholds.json and
# is never restated here; the summary renders whether or not the gate
# fails. The seed is one calibration gap below the measured value, so
# first-run variance greens and only a rise beyond the hysteresis raises.
#
# The same measurement is also reported per change: the measured cell writes
# the XML form of it, the pull-request-only `diff-coverage` job diffs the
# merge commit against its base and renders what the change ADDED, and the
# `coverage-comment` workflow posts it as one pull-request comment. That
# report is deliberately not a gate -- see .github/scripts/diff_coverage.py.

on:
  push:
    # Default branch only: a pull-request head already gets one run from
    # the `pull_request` event below, and an unfiltered `push` schedules
    # the same commit a second time under a different ref, which the
    # `concurrency` group cannot collapse.
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the secrets scan at the bottom of this job reads
          # `git log -p`, so a shallow clone would scan a suffix of history
          # and call the rest clean. A git history read inherits the
          # checkout's depth.
          fetch-depth: 0
          # Nothing pushes; later steps must not inherit a stored token.
          persist-credentials: false

      # ShellCheck ships with the image (0.9.0-1 on ubuntu-24.04, which
      # ubuntu-latest currently maps to, per the runner-images docs:
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md),
      # so no install step: its apt mirror fetch hung intermittently until
      # the job timeout, while a missing binary fails the step in seconds
      # instead of hanging.

      - name: Check every shell file
        # Recurse so adding a nested test helper cannot silently escape lint.
        run: |
          find tests -type f -name '*.sh' -exec shellcheck {} +

      - name: Download gitleaks and verify its digest
        # Last in the job: the three checks above refuse in seconds, while
        # this downloads a binary and walks the full history, so a head that
        # is stale, mis-scoped or badly linted never pays for the scan.
        # Checksum-verified rather than piped from an install script: `curl |
        # bash` would make this job trust whatever that URL serves at run
        # time. The digest is from the release's own checksums file, and a
        # version bump moves it together with secrets.yml's copy of this
        # step.
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history for secrets
        # Bare on purpose: this step's exit status IS the gate, so no
        # condition, fallback or error-swallowing suffix belongs here. The
        # log is public: --verbose names findings, --redact masks them.
        # No --config and no .gitleaks.toml: the default ruleset ran clean
        # against this repository's full history, so an allowlist here would
        # be a way to silence a future finding nobody reviewed.
        # In this job rather than a new one: `shellcheck` is already a
        # required status context running on every pull request and every
        # push to main, both unfiltered, so the scan gates exactly the commits
        # a standalone scan job would — a new job would be a new required
        # context, which means editing the ruleset, and actionlint is
        # disqualified as the host because its push trigger is paths:-filtered
        # to workflow files, so a secret committed to check_pin_tests.py on
        # main would never start the scan.
        run: ./gitleaks detect --verbose --redact

  suites:
    strategy:
      fail-fast: false
      matrix:
        # The repository's matrix: the check names are `suites (ubuntu-latest)`
        # and `suites (macos-latest)`.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The interpreter the action and CI target. It is a toolcache
          # install, not the image's externally managed (PEP 668) system
          # python, so pip may install into it, and every later step's
          # `python3` resolves here: the runner places GITHUB_PATH entries --
          # setup-python's among them -- ahead of the job's path variable
          # when it builds a step's environment, so an interpreter put on
          # PATH through GITHUB_ENV is shadowed by it.
          python-version: '3.15'

      - name: Check no tracked file carries a merge-conflict marker
        # A conflict marker is text that looks like prose in a Markdown
        # file, so every reviewer can read past it and only a mechanical
        # check sees it. git grep reads the tracked files out of the working
        # tree, which on a clean checkout is what the repository ships, and
        # -I keeps a binary from being reported as a match. The three markers
        # are matched in the shapes git writes them: `<<<<<<< ` and `>>>>>>> `
        # carry the label after seven characters, and the separator is exactly
        # seven `=`; diff3's extra `||||||| base` line changes nothing, because
        # the other three are still written. This job rather than the
        # actionlint one because this workflow's push trigger is unfiltered,
        # so it runs for the documentation-only commit that carries the marker
        # as well as for the code change. Explicit `shell: bash` adds
        # --noprofile --norc; pipefail is its only operative delta -- the
        # body already guards `git grep` with `|| found=$?`, so no pipe can
        # turn "no match" into a failure the implicit shell would not have.
        shell: bash
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Compile the screen and the driver
        # py_compile refuses a SyntaxError in seconds, before the suite pays
        # for a run; the suite then exercises every module behaviorally.
        run: python3 -m py_compile check_pin_tests.py run.py scripts/ci/*.py

      - name: Install the regression toolchain
        # --require-hashes pins artifacts as well as versions, and
        # --only-binary keeps an absent wheel a loud failure rather than an
        # unpinned source build.
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt

      - name: Install the type and lint toolchain
        id: install_checks
        # The awk lifts read .github/workflows/requirements.txt, the single
        # source for the versions and hashes: the ruff block alone, and the
        # range from the coverage block to EOF, which carries pylint,
        # pycodestyle and pyright beside the coverage the files these checks
        # read import (.github/scripts/diff_coverage.py). No venv: the
        # setup-python interpreter is not externally managed, so pip installs
        # into it directly, where the later steps resolve the tools.
        run: |
          awk '/^ruff==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/ruff.txt"
          awk '/^(coverage|pylint)==/{f=1} f' .github/workflows/requirements.txt > "$RUNNER_TEMP/checks.txt"
          python3 -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/ruff.txt"
          python3 -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/checks.txt"

      - name: Lint the screen
        # py_compile above refuses a file only for a SyntaxError: E9 and
        # F7's misplaced break/continue already fall inside that refusal.
        # What it accepts silently is the rest of the set -- F631 (assert
        # on a tuple), F632 (comparison with a literal), F633 (invalid
        # print syntax), F634 (condition on a tuple), F82 (undefined
        # names) -- undefined names above all. The lint runs the whole
        # defect-oriented intersection set pr-gate gates, and
        # deliberately not plain F, whose F401 and F841 red CI on benign
        # refactors.
        run: |
          ruff check --select E9,F63,F7,F82 check_pin_tests.py run.py scripts/ci/*.py

      - name: pycodestyle
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        # pycodestyle reads setup.cfg from the working directory: the
        # measured ceiling and the two named ignores live there.
        run: git ls-files '*.py' | xargs pycodestyle

      - name: pylint
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        # .pylintrc turns the style categories off and leaves the error
        # and warning checks on, and the exit code is the verdict --
        # never the 10.00/10 score line, which reports nothing about
        # what was found.
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc

      - name: pyright
        if: ${{ !cancelled() && steps.install_checks.outcome == 'success' }}
        # Basic mode, with the include list (the screen, the driver and
        # the suite) in pyrightconfig.json. The exit code is the gate:
        # no baseline and no ratchet, because the tree passes outright.
        run: pyright --project pyrightconfig.json
      # The measured cell writes coverage's startup hook into the site
      # directory of setup-python's interpreter and arms the two env vars
      # the job inherits through GITHUB_ENV, so the measurer starts inside
      # every python3 the job runs. On the other cell the step is skipped
      # and the suite runs unmeasured.
      - name: Install coverage tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          awk '/^coverage==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/coverage.txt"
          python3 -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/coverage.txt"
          site_dir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          printf 'import coverage; coverage.process_startup()\n' > "$site_dir/00-pin-guard-coverage-subprocess.pth"
          mkdir -p "$RUNNER_TEMP/pin-guard-coverage"
          {
            echo "COVERAGE_PROCESS_START=$PWD/.coveragerc"
            echo "COVERAGE_FILE=$RUNNER_TEMP/pin-guard-coverage/.coverage"
          } >> "$GITHUB_ENV"

      - name: Run the behavioral suite
        run: python3 -m pytest tests/ -q --tb=short -ra

      # The suite's python3 processes each wrote their own data file (parallel
      # mode in .coveragerc), so they are combined before anything reads a
      # total. Every coverage command names its config with --rcfile so the
      # steps do not lean on coverage's working-directory discovery.
      - name: Record the coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m coverage combine --rcfile=.coveragerc
          python3 -m coverage report --format=markdown --precision=1 --rcfile=.coveragerc >> "$GITHUB_STEP_SUMMARY"

      # The floor is read from the committed file rather than restated here, so
      # a floor change is a diff to the file a reviewer sees, not a buried
      # literal in the step.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          floor="$(python3 -c 'import json; print(json.load(open(".github/ci-thresholds.json"))["coverage"]["python"]["floor"])')"
          python3 -m coverage report --fail-under="$floor" --precision=1 --rcfile=.coveragerc

      # The XML form of the same measurement the summary just read: the
      # pull-request-only diff-coverage job cannot re-run the suite, so the
      # measured cell ships it. The matrix has exactly one uploading leg, so
      # the `coverage-xml` name names one measurement by construction.
      - name: Write the coverage XML
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m coverage xml --rcfile=.coveragerc -o coverage.xml
      - name: Upload the coverage XML
        # actions/upload-artifact v7.0.1
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      # Stage ratchet data from main pushes only: a PR run measures the
      # merge tree, which main will never hold, and ratchet-push's own if:
      # ignores PR runs anyway. Exactly one leg uploads, so ratchet-push
      # names one measurement just as coverage-xml does above.
      - name: Record the ratchet data
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        run: |
          measured="$(python3 -m coverage report --format=total --precision=1 --rcfile=.coveragerc)"
          python3 .github/scripts/ratchet_thresholds.py --measured "$measured" \
            --thresholds .github/ci-thresholds.json \
            --out-dir "$RUNNER_TEMP/ratchet-data"
          # Absence IS the no-raise signal. Every refusal exits nonzero,
          # so no artifact can mean only that no raise was justified,
          # never that the script failed quietly. Write the base only
          # alongside staged data, so a no-op cannot create an artifact.
          if [ -f "$RUNNER_TEMP/ratchet-data/ci-thresholds.json" ] ; then
            git rev-parse HEAD > "$RUNNER_TEMP/ratchet-data/base.txt"
          fi

      - name: Upload the ratchet data
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-push
          path: ${{ runner.temp }}/ratchet-data
          if-no-files-found: ignore
          retention-days: 1

  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Judge the PR's own tree. Full history carries the base object
          # without depending on retained credentials.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check line counts against the size baseline
        # Forced check: workflow_dispatch is an event auto fails closed on.
        # The records the pinned action reads live in .github/size-baseline.json.
        uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}

  aggregate:
    # Like claudit's aggregate: always report, including after a failed or
    # cancelled ancestor. This tree has no classification skips, so every
    # skipped, failed, cancelled or missing leg must fold red.
    # actionlint reports independently; needs can only name this workflow's legs.
    needs: [suites, shellcheck, size-baseline]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fold the leg results into one verdict
        env:
          PIN_GUARD_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/aggregate_gate.py

  ratchet:
    # Staging is keyless and follows the whole gate, not just one matrix cell.
    # A records-only push runs this job once more, but the no-change stage below
    # emits no artifact and terminates the push chain.
    needs: aggregate
    if: >-
      success() && needs.aggregate.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tighten the size records after the green gate
        # Same records the check job reads above; the pinned action
        # tightens in place and the stage step stages whatever changed.
        uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          mode: tighten
      - name: Stage changed records for the separate push workflow
        id: stage
        env:
          PIN_GUARD_BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PIN_GUARD_BASE_SHA" ]; then
            echo 'Checkout does not match the measured run head' >&2
            exit 1
          fi
          changed=0
          git diff --quiet -- .github/size-baseline.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ratchet-push"
          cp .github/size-baseline.json "$RUNNER_TEMP/ratchet-push/size-baseline.json"
          printf '%s\n' "$PIN_GUARD_BASE_SHA" > "$RUNNER_TEMP/ratchet-push/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Upload the changed records
        if: success() && steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Distinct from the suites job's thresholds artifact above: a run's
          # artifact names are one namespace shared by every job in it.
          name: size-baseline-ratchet
          path: ${{ runner.temp }}/ratchet-push
          if-no-files-found: error
          retention-days: 1

  # The per-change half of the coverage story: of the lines this pull
  # request ADDED that coverage considers executable, how many the suite
  # reached. INFORMATIONAL, never a gate -- the tree-wide figure in the
  # job summary is a figure a reviewer judges, not a threshold that
  # blocks a merge, so it is in no required context.
  #
  # Pull requests only, and only when the suite actually measured: a skipped
  # or failed ancestor must not be reported as a number.
  diff-coverage:
    needs: suites
    if: ${{ !cancelled() && needs.suites.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job checks out and runs code from the pull request (the script
    # below is the pull request's own copy), so it must not carry a token
    # that can write conversation. The trusted coverage-comment workflow
    # owns that token.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit the event named -- the exact SHA the suites job
          # measured -- and not `refs/pull/N/merge` resolved now, which could
          # hand this job a different tree than the one the report describes
          # if GitHub recomputed the merge ref between the two jobs. Full
          # history, because the diff below needs HEAD^1, the base tip that
          # was merged into it.
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Nothing in this job pushes; later steps must not inherit a stored
          # token.
          persist-credentials: false

      - name: Download the coverage XML
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      # The same install the coverage cell makes, for the same reason: the
      # statement analyzer the script drives is coverage.py, which no image
      # preinstalls and a PEP 668 system python refuses to take. No startup
      # hook and no COVERAGE_PROCESS_START here -- no suite runs in this job,
      # so there is nothing to measure, only a report to read.
      - name: Install coverage tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          awk '/^coverage==/{f=1} f{print; if ($0 !~ /\\$/) exit}' .github/workflows/requirements.txt > "$RUNNER_TEMP/coverage.txt"
          "$RUNNER_TEMP/coverage-venv/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/coverage.txt"
          echo "PATH=$RUNNER_TEMP/coverage-venv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Measure the coverage of this change
        # HEAD is the merge tree checked out above and HEAD^1 is, by
        # construction, the base tip that was merged into it. The event
        # payload's `base.sha` is NOT that: the base branch can advance
        # between the event and the checkout, and every base commit merged in
        # since would then be reported as a line this pull request added.
        run: |
          git diff --text --no-ext-diff --no-textconv --unified=0 HEAD^1 HEAD > patch.diff
          python3 .github/scripts/diff_coverage.py \
            --coverage coverage.xml \
            --diff patch.diff > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the comment for the trusted commenter
        # Through env, never interpolation: the number is event data, and a
        # run: block that inlined it would be program text built from input.
        env:
          PIN_GUARD_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PIN_GUARD_PR_NUMBER" > pr-number.txt

      - name: Upload the comment for the trusted commenter
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-coverage-comment
          path: |
            body.md
            pr-number.txt
          if-no-files-found: error
